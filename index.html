<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Distribuidores a Nivel Nacional | Naturaleza Abierta</title>
<style>
  :root {
    --verde: #2f6b3a;
    --verde-claro: #eaf3ea;
    --texto: #23291f;
    --borde: #dbe4db;
    --fondo: #ffffff;
    --suave: #6b7a6b;
    --lista: #444444;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: var(--fondo);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--texto);
  }
  .lienzo {
    width: 100%;
    max-width: 100%;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  header {
    background: var(--verde);
    color: #fff;
    padding: 28px 20px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 1.5rem; }
  header p { margin: 0; opacity: .9; font-size: .95rem; }

  .aviso {
    background: #fff6e0;
    border-bottom: 1px solid #f0dca0;
    color: #6b5006;
    padding: 14px 20px;
    font-size: .88rem;
    text-align: center;
  }

  .estado-bloque { border-bottom: 1px solid var(--borde); }
  .estado-cabecera {
    width: 100%;
    text-align: left;
    background: var(--verde-claro);
    border: none;
    padding: 16px 20px;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--verde);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    font-family: inherit;
  }
  .estado-cabecera:focus-visible { outline: 3px solid #25D366; outline-offset: -3px; }
  .estado-cabecera .flecha { transition: transform .2s; }
  .estado-cabecera.abierto .flecha { transform: rotate(90deg); }
  .estado-contenido { display: none; padding: 4px 0 8px; }
  .estado-contenido.abierto { display: block; }

  .ciudad-titulo {
    font-size: .8rem;
    letter-spacing: .04em;
    color: var(--suave);
    padding: 12px 20px 4px;
    font-weight: 600;
  }

  .tarjeta-distribuidor {
    display: flex;
    gap: 14px;
    padding: 14px 20px;
    border-top: 1px solid var(--borde);
    align-items: flex-start;
  }
  .foto {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--verde-claro);
    flex-shrink: 0;
  }
  .info { flex: 1; min-width: 0; }
  .nombre { font-weight: 600; font-size: .98rem; }
  .productos-lista {
    margin: 6px 0 10px;
    padding: 0;
    list-style: none;
    font-size: .88rem;
    color: var(--lista);
  }
  .productos-lista li { padding: 2px 0; }
  .whatsapp-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #1a7f43;
    color: #fff;
    text-decoration: none;
    padding: 9px 15px;
    border-radius: 20px;
    font-size: .85rem;
    font-weight: 600;
  }
  .whatsapp-btn:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }

  .vacio, .cargando {
    padding: 40px 20px;
    text-align: center;
    color: var(--suave);
    line-height: 1.5;
  }
  .vacio a { color: var(--verde); font-weight: 600; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --verde-claro: #16241a;
      --borde: #2a332a;
      --texto: #eef1ee;
      --fondo: #10140f;
      --suave: #a3b0a3;
      --lista: #cfd6cf;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .estado-cabecera .flecha { transition: none; }
  }
</style>
</head>
<body>
<div class="lienzo">
  <header>
    <h1>Distribuidores a Nivel Nacional</h1>
    <p>Encuentra un distribuidor con stock disponible en tu estado</p>
  </header>

  <div class="aviso">
    La responsabilidad de entrega y pago con cada distribuidor es exclusiva del distribuidor.
    Naturaleza Abierta solo facilita el contacto entre las partes.
  </div>

  <div id="lista">
    <div class="cargando">Cargando distribuidores…</div>
  </div>
</div>

<script>
  // Llama directo al RPC público (sin librerías externas). El servidor devuelve solo lo necesario:
  // nombre, zona, foto, teléfono y productos con stock. Nunca lee las tablas de clientes/afiliados.
  const SUPABASE_URL = "https://tgvcvnhrwswuxgjbpvwq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_EKV8OM1y96u-DV_kUPGwkg_BZuGdf4D";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  // Deja el teléfono en formato internacional para wa.me (0412... -> 58412...)
  function telefonoWa(t) {
    let d = String(t || "").replace(/\D/g, "");
    if (!d) return "";
    if (d.startsWith("0")) d = "58" + d.slice(1);
    else if (!d.startsWith("58")) d = "58" + d;
    return d;
  }

  function linkWhatsApp(telefono, producto, estado) {
    const numero = telefonoWa(telefono);
    if (!numero) return "";
    const texto = `Hola! Vengo de la plataforma de Naturaleza Abierta y estoy interesado en: ${producto}. ¿Aún lo tienes disponible? (Zona: ${estado})`;
    return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
  }

  // Solo permite fotos https para no inyectar esquemas raros en <img src>
  function urlSegura(u) {
    return /^https:\/\//i.test(String(u || "")) ? u : "";
  }

  async function cargarDirectorio() {
    const cont = document.getElementById("lista");
    let filas;

    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/fn_directorio_distribuidores_stock`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": `Bearer ${SUPABASE_KEY}`
        },
        body: "{}"
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      filas = await res.json();
    } catch (e) {
      console.error("Directorio:", e);
      cont.innerHTML = `<div class="vacio">No se pudo cargar el directorio en este momento. Intenta de nuevo en unos minutos.</div>`;
      return;
    }

    if (!Array.isArray(filas) || filas.length === 0) {
      cont.innerHTML = `<div class="vacio">Todavía no hay distribuidores con stock disponible.<br>Mientras tanto puedes pedir tu producto en el <a href="https://catalogo.naturalezaabierta.com/">catálogo</a>.</div>`;
      return;
    }

    // Agrupar por estado > ciudad (zona_estado_ciudad = "Estado, Ciudad")
    const porEstado = {};
    filas.forEach(d => {
      const partes = String(d.zona_estado_ciudad || "").split(",").map(p => p.trim()).filter(Boolean);
      const estado = partes[0] || "Sin estado registrado";
      const ciudad = partes[1] || "General";
      (porEstado[estado] = porEstado[estado] || {});
      (porEstado[estado][ciudad] = porEstado[estado][ciudad] || []).push({ ...d, estado });
    });

    cont.innerHTML = "";
    Object.keys(porEstado).sort((a, b) => a.localeCompare(b, "es")).forEach((estado, idx) => {
      const bloque = document.createElement("div");
      bloque.className = "estado-bloque";

      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "estado-cabecera";
      btn.setAttribute("aria-expanded", idx === 0 ? "true" : "false");
      btn.innerHTML = `<span>${esc(estado)}</span><span class="flecha" aria-hidden="true">▸</span>`;

      const contenido = document.createElement("div");
      contenido.className = "estado-contenido";

      Object.keys(porEstado[estado]).sort((a, b) => a.localeCompare(b, "es")).forEach(ciudad => {
        if (ciudad !== "General") {
          const t = document.createElement("div");
          t.className = "ciudad-titulo";
          t.textContent = ciudad;
          contenido.appendChild(t);
        }
        porEstado[estado][ciudad].forEach(d => {
          const productos = Array.isArray(d.productos) ? d.productos : [];
          const productosHtml = productos.map(p => {
            const precio = p.precio ? ` — $${Number(p.precio).toFixed(2)}` : "";
            return `<li>${esc(p.nombre)} (${esc(p.cantidad)} disp.)${precio}</li>`;
          }).join("");

          const primero = productos[0] ? productos[0].nombre : "tus productos";
          const link = linkWhatsApp(d.telefono_whatsapp, primero, d.estado);
          const nombre = [d.nombre, d.apellido].filter(Boolean).join(" ") || "Distribuidor";
          const foto = urlSegura(d.foto_url);

          const tarjeta = document.createElement("div");
          tarjeta.className = "tarjeta-distribuidor";
          tarjeta.innerHTML = `
            ${foto ? `<img class="foto" src="${esc(foto)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="foto" aria-hidden="true"></span>`}
            <div class="info">
              <div class="nombre">${esc(nombre)}</div>
              <ul class="productos-lista">${productosHtml}</ul>
              ${link ? `<a class="whatsapp-btn" href="${esc(link)}" target="_blank" rel="noopener">Escribir por WhatsApp</a>` : ""}
            </div>`;
          contenido.appendChild(tarjeta);
        });
      });

      btn.addEventListener("click", () => {
        const abierto = btn.classList.toggle("abierto");
        contenido.classList.toggle("abierto", abierto);
        btn.setAttribute("aria-expanded", abierto ? "true" : "false");
      });

      // El primer estado abierto por defecto
      if (idx === 0) { btn.classList.add("abierto"); contenido.classList.add("abierto"); }

      bloque.appendChild(btn);
      bloque.appendChild(contenido);
      cont.appendChild(bloque);
    });
  }

  cargarDirectorio();
</script>
</body>
</html>
